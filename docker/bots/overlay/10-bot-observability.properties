# LIVE bot profile: observability and environmental controls only.
gameserver.network.logging.unknown_packets = true
gameserver.network.logging.ignored_packets = true

# L0 exercises the production GameServer <-> ChatServer bridge. Keep both ends explicitly enabled and
# authenticated in the isolated bot stack instead of inheriting the retail-disabled/default-empty values.
gameserver.chatserver.enable = true
gameserver.network.chat.password = aion-bots
chatserver.network.gameserver.password = aion-bots

gameserver.log.craft = true
gameserver.log.player.exchange = true
gameserver.log.broker.exchange = true
gameserver.log.kill = true
gameserver.log.mail = true
gameserver.log.item = true

gameserver.security.captcha.enable = false
loginserver.server.bruteforceprotector = false
loginserver.accounts.autocreate = true

gameserver.administration.login.announce_levels =
gameserver.administration.login.announce_to_all_players = false
gameserver.administration.logout.announce_to_all_players = false

# Keep custom XP/drop modifiers from changing deterministic scenario outcomes.
gameserver.event.service.disabled_events = Beyond Aion Server Buffs, Increased XP Rates, Increased Gathering & Crafting XP Rates, Increased Drop Rates, Increased Drop Rates 50%
